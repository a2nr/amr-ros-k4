<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockly ROS2 Robot Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #2d2d2d;
      border-bottom: 1px solid #404040;
      flex-shrink: 0;
    }

    #toolbar button {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    #toolbar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-run {
      background: #4caf50;
      color: white;
    }

    #btn-step-over {
      background: #2196f3;
      color: white;
    }

    #btn-step-into {
      background: #9c27b0;
      color: white;
    }

    #btn-stop {
      background: #f44336;
      color: white;
    }

    #toolbar .separator {
      width: 1px;
      height: 24px;
      background: #555;
      margin: 0 4px;
    }

    #debug-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 13px;
    }

    #debug-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    #workspace-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #tab-bar {
      display: flex;
      background: #2d2d2d;
      border-bottom: 1px solid #404040;
      flex-shrink: 0;
      height: 32px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      padding: 0 16px;
      height: 32px;
    }

    .tab-btn.active {
      color: #d4d4d4;
      border-bottom-color: #4caf50;
    }

    .tab-btn:hover:not(.active) {
      color: #bbb;
      background: rgba(255,255,255,0.05);
    }

    #blockly-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #code-panel {
      flex: 1;
      background: #1a1a1a;
      overflow: auto;
      padding: 12px;
    }

    #code-output {
      margin: 0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #btn-export {
      background: #607d8b;
      color: white;
    }

    #btn-import {
      background: #455a64;
      color: white;
    }

    /* SVG flyout label text — not controlled by Blockly theme componentStyles */
    .blocklyFlyoutLabelText { fill: #cccccc !important; }

    #blockly-div {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #console-panel {
      height: 150px;
      background: #1a1a1a;
      border-top: 1px solid #404040;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      flex-shrink: 0;
    }

    #console-panel .log-entry {
      padding: 1px 0;
      white-space: pre-wrap;
    }

    #console-panel .log-info { color: #9cdcfe; }
    #console-panel .log-success { color: #4ec9b0; }
    #console-panel .log-error { color: #f48771; }
    #console-panel .log-feedback { color: #dcdcaa; }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <button id="btn-run" onclick="onRunClick()">Run</button>
    <button id="btn-step-over" onclick="stepOver()" disabled>Step Over</button>
    <button id="btn-step-into" onclick="stepInto()" disabled>Step Into</button>
    <div class="separator"></div>
    <button id="btn-stop" onclick="stopExecution()" disabled>Stop</button>
    <div class="separator"></div>
    <button id="btn-export" onclick="exportWorkspace()">Export</button>
    <button id="btn-import" onclick="importWorkspace()">Import</button>
    <div id="debug-toggle">
      <input type="checkbox" id="chk-debug" onchange="onDebugToggle(this.checked)">
      <label for="chk-debug">Debug Mode</label>
    </div>
  </div>

  <!-- Blockly Workspace + Code Tab -->
  <div id="workspace-area">
    <div id="tab-bar">
      <button class="tab-btn active" id="tab-blocks" onclick="switchTab('blocks')">Blocks</button>
      <button class="tab-btn" id="tab-code" onclick="switchTab('code')">Code</button>
    </div>
    <div id="blockly-area">
      <div id="blockly-div"></div>
    </div>
    <div id="code-panel" style="display:none">
      <pre id="code-output"></pre>
    </div>
  </div>

  <!-- Console Output -->
  <div id="console-panel"></div>

  <!-- Console logging (must be defined before other scripts that use consoleLog) -->
  <script>
    function consoleLog(message, type) {
      type = type || 'info';
      var panel = document.getElementById('console-panel');
      var entry = document.createElement('div');
      entry.className = 'log-entry log-' + type;
      var time = new Date().toLocaleTimeString();
      entry.textContent = '[' + time + '] ' + message;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
    }
  </script>

  <!-- Load Blockly from local vendor files -->
  <script src="vendor/blockly.min.js"></script>
  <script src="vendor/blocks_compressed.js"></script>
  <script src="vendor/javascript_compressed.js"></script>
  <script src="vendor/en.js"></script>

  <!-- Core infrastructure (load order matters) -->
  <script src="blockly/core/registry.js"></script>
  <script src="blockly/core/breakpoints.js"></script>
  <script src="blockly/core/bridge.js"></script>
  <script src="blockly/core/debug-engine.js"></script>
  <script src="blockly/core/ui-controls.js"></script>
  <script src="blockly/core/ui-tabs.js"></script>
  <script src="blockly/core/workspace-io.js"></script>

  <!-- Block manifest and loader -->
  <script src="blockly/blocks/manifest.js"></script>
  <script src="blockly/loader.js"></script>

  <!-- Workspace initialization -->
  <script src="blockly/workspace-init.js"></script>

  <!-- Initialize: load all blocks, then create workspace -->
  <script>
    // Global workspace variable — used by debug-engine.js and ui-controls.js
    var workspace;

    loadAllBlocks()
      .then(function () {
        workspace = initWorkspace();
      })
      .catch(function (err) {
        consoleLog('Failed to load blocks: ' + err.message, 'error');
      });
  </script>
</body>
</html>
